<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI MEASUREMENT | Macondo Project</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="shortcut icon" href="images/bmi-favicon.png" type="image/x-icon">
</head>
<body>

    <nav>
        <div class="nav-left">
            <span class="project-name">BMI MEASUREMENT</span>
        </div>
        <div class="profile">
            <span>Dilsan Basnet</span>
        
                <img  class="profile-img" src="images/profile-image.png" alt="profile image">
            
        </div>
    </nav>

<main class="content-wrapper">
    <div class="bmi-container">
        <div class="headerarea">
            <h1>BMI CALCULATOR</h1>
            <p>Calculate Body Mass Index just enter Height and Weight.</p>
        </div>

        <div class="form-group">
         <label for="">Enter Height</label>
            <div class="enterInput">
         <input type="number" id="height-input" placeholder=" eg; 172">
            <span class="unit-tag">CM</span>
            </div>
        </div>
    <div class="form-group">
        <label for="weight-input">Enter Weight</label>
        <div class="enterInput">
<input type="number" id="weight-input" placeholder=" eg; 63">
<span class="unit-tag">KG</span>
        </div>
    </div>

    <button class="button" onclick="processData()">Calculate BMI</button>

    <div class="result" id="output-area">
        <p>Your BMI is:</p>
        <span id="bmi-output">0.0</span>
        <div class="status-badge" id="status-badge">NORMAL</div>
        <p id="feedback" style="margin-top: 15px; font-size: 15px; color: rgb(93, 92, 92);"></p>
    </div>
    </div>
</main>
